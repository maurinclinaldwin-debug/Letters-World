<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#df9c53" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#df9c53" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c0e14" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Golden Metallic Gradient -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="30%" stop-color="#f5cb98" />
      <stop offset="70%" stop-color="#df9c53" />
      <stop offset="100%" stop-color="#8c4e18" />
    </linearGradient>

    <!-- Parchment Letter Gradient -->
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ec" />
      <stop offset="100%" stop-color="#e2cfb7" />
    </linearGradient>

    <!-- Mountain Crest Gradient -->
    <linearGradient id="mountainRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3245" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
  </defs>

  <!-- Base Icon Container (Dark Twilight Obsidian Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1017" stroke="url(#goldMetal)" stroke-width="1.5" stroke-opacity="0.55" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ambientGlow)" />

  <!-- Mountain Silhouette in Background of Letter -->
  <path d="M8 44 L22 28 L32 38 L44 24 L56 44 Z" fill="url(#mountainRidge)" opacity="0.6" />
  <path d="M22 28 L27 34 L20 37 Z" fill="#ffffff" opacity="0.25" />
  <path d="M44 24 L48 30 L42 32 Z" fill="#ffffff" opacity="0.3" />

  <!-- The Love Letter / Envelope Base -->
  <g transform="translate(11, 23)">
    <!-- Envelope Body -->
    <rect x="0" y="6" width="42" height="26" rx="3.5" fill="url(#parchment)" stroke="#221a14" stroke-width="0.75" />

    <!-- Lower Fold Lines -->
    <path d="M1 31 L18 17 L24 17 L41 31" fill="none" stroke="#ba9e80" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    
    <!-- Top Flap (Open Triad Pointing to Seal) -->
    <path d="M1 7 L21 21 L41 7" fill="#f3e5d3" stroke="#ba9e80" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Golden Wax Seal at Center -->
    <circle cx="21" cy="20" r="5.5" fill="url(#goldMetal)" />
    <circle cx="21" cy="20" r="4.2" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.6" />
    
    <!-- Miniature Heart / Monogram on Seal -->
    <path d="M21 22.2 C21 22.2 18.5 20.2 18.5 18.8 C18.5 17.8 19.3 17.2 20.1 17.2 C20.6 17.2 20.9 17.5 21 17.7 C21.1 17.5 21.4 17.2 21.9 17.2 C22.7 17.2 23.5 17.8 23.5 18.8 C23.5 20.2 21 22.2 21 22.2 Z" fill="#54250e" />
  </g>

  <!-- Ascending Celestial Sparkle / Starlight Beacon -->
  <g transform="translate(45, 10)">
    <!-- 4-pointed Celestial Star -->
    <path d="M6 0 C6 3.5 8.5 6 12 6 C8.5 6 6 8.5 6 12 C6 8.5 3.5 6 0 6 C3.5 6 6 3.5 6 0 Z" fill="url(#goldMetal)" />
    <circle cx="6" cy="6" r="1" fill="#ffffff" />
  </g>

  <!-- Small secondary ambient star -->
  <circle cx="15" cy="14" r="1" fill="#f5cb98" opacity="0.8" />
  <circle cx="20" cy="11" r="0.6" fill="#ffffff" opacity="0.6" />
</svg>
